<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>LOGIX WMS - Terminal de Doca Móvel</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .font-mono-code {
      font-family: 'JetBrains Mono', monospace;
    }
    @keyframes pulse-slow {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.95); }
    }
    .animate-pulse-slow {
      animation: pulse-slow 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    @keyframes ping-once {
      0% { transform: scale(1); opacity: 0.8; }
      100% { transform: scale(1.08); opacity: 0; }
    }
    .flash-read {
      animation: ping-once 0.35s ease-out;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col antialiased selection:bg-emerald-500 selection:text-slate-950">

  <!-- Cabeçalho Corporativo de Logística -->
  <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-30 px-4 py-3 shadow-md shadow-slate-950/50">
    <div class="max-w-md mx-auto flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <!-- Logótipo / Ícone Doca -->
        <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-blue-600 to-indigo-700 flex items-center justify-center text-white shadow-inner shadow-blue-400/20 border border-blue-500/30">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" />
          </svg>
        </div>
        <div>
          <div class="flex items-center space-x-2">
            <span class="font-extrabold text-sm tracking-wider text-slate-100">LOGIX</span>
            <span class="text-[10px] uppercase font-bold tracking-widest px-1.5 py-0.5 rounded bg-blue-500/20 text-blue-400 border border-blue-500/30">WMS v2.4</span>
          </div>
          <p class="text-xs text-slate-400 font-medium">Terminal Inbound &bull; <span class="text-amber-400 font-semibold">Doca 04</span></p>
        </div>
      </div>

      <!-- Badge de Status de Conexão -->
      <div class="flex items-center space-x-1.5 bg-slate-800/80 border border-slate-700/60 rounded-full px-2.5 py-1">
        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
        <span class="text-[11px] font-semibold text-slate-300">Nuvem Online</span>
      </div>
    </div>
  </header>

  <!-- Conteúdo Principal -->
  <main class="flex-1 max-w-md w-full mx-auto p-4 flex flex-col space-y-4">

    <!-- KPI / Métricas Rápidas -->
    <section class="grid grid-cols-2 gap-3">
      <div class="bg-slate-900/90 border border-slate-800/80 rounded-2xl p-3.5 shadow-sm">
        <span class="text-[11px] uppercase tracking-wider text-slate-400 font-semibold block">Volume Recebido</span>
        <div class="flex items-baseline space-x-1.5 mt-1">
          <span id="counterDisplay" class="text-2xl font-black text-slate-100 tracking-tight">0</span>
          <span class="text-xs text-slate-400 font-medium">unidades</span>
        </div>
      </div>
      <div class="bg-slate-900/90 border border-slate-800/80 rounded-2xl p-3.5 shadow-sm">
        <span class="text-[11px] uppercase tracking-wider text-slate-400 font-semibold block">Último Registo</span>
        <div class="flex
